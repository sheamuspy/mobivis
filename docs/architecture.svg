<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <style>
      .box { fill: #2d2d2d; stroke: #5c5c5c; stroke-width: 2; rx: 8; }
      .inner-box { fill: #1e1e1e; stroke: #4b4b4b; stroke-width: 1; rx: 4; }
      .text { fill: #cccccc; font-family: system-ui; font-size: 14px; }
      .small-text { fill: #888888; font-family: system-ui; font-size: 11px; }
      .arrow { stroke: #5c5c5c; stroke-width: 2; marker-end: url(#arrowhead); }
      .label { fill: #6b6b6b; font-family: system-ui; font-size: 12px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5c5c5c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="320" y="40" fill="#ffffff" font-family="system-ui" font-size="24" font-weight="bold">Mobivis Architecture</text>
  <text x="320" y="65" fill="#6b6b6b" font-family="system-ui" font-size="14">Real-time file sync from computer to phone</text>
  
  <!-- Computer Box -->
  <rect x="60" y="120" width="200" height="180" class="box"/>
  <text x="160" y="100" text-anchor="middle" class="text" font-weight="bold">Your Computer</text>
  
  <!-- Computer internals -->
  <rect x="90" y="150" width="140" height="50" class="inner-box"/>
  <text x="160" y="180" text-anchor="middle" class="label">Node.js Server</text>
  
  <rect x="90" y="210" width="140" height="40" class="inner-box"/>
  <text x="160" y="235" text-anchor="middle" class="label">chokidar (watch)</text>
  
  <rect x="90" y="260" width="140" height="30" class="inner-box"/>
  <text x="160" y="280" text-anchor="middle" class="small-text">File System</text>
  
  <!-- WebSocket cloud -->
  <ellipse cx="450" cy="210" rx="80" ry="50" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="450" y="205" text-anchor="middle" class="text" font-size="12">WebSocket</text>
  <text x="450" y="220" text-anchor="middle" class="small-text">ws://:8080</text>
  
  <!-- Arrow 1 -->
  <line x1="270" y1="210" x2="360" y2="210" class="arrow"/>
  
  <!-- Arrow 2 -->
  <line x1="540" y1="210" x2="620" y2="210" class="arrow"/>
  
  <!-- Phone Box -->
  <rect x="640" y="120" width="200" height="180" class="box"/>
  <text x="740" y="100" text-anchor="middle" class="text" font-weight="bold">Your Phone</text>
  
  <!-- Phone internals -->
  <rect x="670" y="150" width="140" height="50" class="inner-box"/>
  <text x="740" y="180" text-anchor="middle" class="label">Expo App</text>
  
  <rect x="670" y="210" width="140" height="40" class="inner-box"/>
  <text x="740" y="235" text-anchor="middle" class="label">Monaco Editor</text>
  
  <rect x="670" y="260" width="140" height="30" class="inner-box"/>
  <text x="740" y="280" text-anchor="middle" class="small-text">WebView</text>
  
  <!-- Footer labels -->
  <text x="160" y="350" text-anchor="middle" class="small-text">Port 8080 • Watches cwd</text>
  <text x="450" y="350" text-anchor="middle" class="small-text">Real-time sync</text>
  <text x="740" y="350" text-anchor="middle" class="small-text">Tap ☰ to browse • ⚙️ for settings</text>
</svg>